name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26

    permissions:
      checks: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test-output.txt
        continue-on-error: true

      - name: Generate JUnit XML
        if: always()
        run: |
          python3 << 'EOF'
          import re, html

          with open("swift-test-output.txt") as f:
              content = f.read()

          passed = re.findall(r'Test "(.+?)" passed', content)
          failed = re.findall(r'Test "(.+?)" failed', content)
          all_tests = [(name, True) for name in passed] + [(name, False) for name in failed]

          tests   = len(all_tests)
          failures = len(failed)

          lines = ['<?xml version="1.0" encoding="UTF-8"?>',
                   f'<testsuites tests="{tests}" failures="{failures}">',
                   f'  <testsuite name="Swift Tests" tests="{tests}" failures="{failures}">']

          for name, ok in all_tests:
              safe = html.escape(name)
              if ok:
                  lines.append(f'    <testcase name="{safe}" classname="Swift.Tests"/>')
              else:
                  lines.append(f'    <testcase name="{safe}" classname="Swift.Tests">')
                  lines.append( '      <failure message="Test failed"/>')
                  lines.append( '    </testcase>')

          lines += ['  </testsuite>', '</testsuites>']

          with open("test-results.xml", "w") as f:
              f.write("\n".join(lines))

          print(f"Generated test-results.xml: {tests} tests, {failures} failures")
          EOF

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Swift Tests
          path: test-results.xml
          reporter: java-junit
          fail-on-error: true
