<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#1A1A1F"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F05138"/>
      <stop offset="100%" stop-color="#C73E29"/>
    </linearGradient>
    <linearGradient id="clientFill" x1="495" y1="66" x2="613" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#321A13"/>
      <stop offset="100%" stop-color="#22160F"/>
    </linearGradient>
    <linearGradient id="claudeFill" x1="648" y1="54" x2="788" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A2218"/>
      <stop offset="100%" stop-color="#1E1C16"/>
    </linearGradient>
    <linearGradient id="openAIFill" x1="648" y1="96" x2="788" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F2318"/>
      <stop offset="100%" stop-color="#0A1910"/>
    </linearGradient>
    <linearGradient id="appleFill" x1="648" y1="138" x2="788" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F2235"/>
      <stop offset="100%" stop-color="#0A1A28"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,1 L6,3.5 L0,6 Z" fill="#6A6A6E"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="url(#bg)" rx="12"/>

  <!-- Corner glow -->
  <radialGradient id="cornerGlow" cx="900" cy="0" r="380" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#F05138" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#F05138" stop-opacity="0"/>
  </radialGradient>
  <rect width="900" height="240" fill="url(#cornerGlow)" rx="12"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="240" fill="url(#accentBar)" rx="2"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- LEFT SECTION                            -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Package name -->
  <text x="32" y="75" fill="#FFFFFF" font-size="36" font-weight="700" letter-spacing="-1">AIProviderKit</text>

  <!-- Orange rule -->
  <rect x="32" y="84" width="216" height="2.5" fill="#F05138" rx="1.25"/>

  <!-- Tagline -->
  <text x="32" y="110" fill="#D0D0D8" font-size="13">Provider-agnostic AI integration for Swift 6</text>

  <!-- Feature badges -->
  <rect x="32"  y="128" width="96"  height="24" rx="12" fill="#1C1C22" stroke="#4A4A52" stroke-width="1"/>
  <text x="80"  y="144" fill="#3FA0FF" font-size="11" font-weight="500" text-anchor="middle">⚡ Streaming</text>

  <rect x="136" y="128" width="78"  height="24" rx="12" fill="#1C1C22" stroke="#4A4A52" stroke-width="1"/>
  <text x="175" y="144" fill="#4CD964" font-size="11" font-weight="500" text-anchor="middle">⚙ Tools</text>

  <rect x="222" y="128" width="72"  height="24" rx="12" fill="#1C1C22" stroke="#4A4A52" stroke-width="1"/>
  <text x="258" y="144" fill="#FFB830" font-size="11" font-weight="500" text-anchor="middle">✦ Skills</text>

  <!-- Platform / language line -->
  <text x="32" y="193" fill="#7A7A82" font-size="11">Swift 6  ·  Sendable  ·  async/await  ·  iOS 26+  ·  macOS 26+</text>

  <!-- Vertical divider -->
  <line x1="338" y1="24" x2="338" y2="216" stroke="#303038" stroke-width="1"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- RIGHT SECTION — Architecture diagram   -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Section label -->
  <text x="862" y="36" fill="#4A4A52" font-size="10" text-anchor="end" letter-spacing="1.5">ARCHITECTURE</text>

  <!-- "Your App" box -->
  <rect x="362" y="94" width="94" height="36" rx="7" fill="#1E1E26" stroke="#505058" stroke-width="1.5"/>
  <text x="409" y="117" fill="#E0E0E8" font-size="11.5" font-weight="600" text-anchor="middle">Your App</text>

  <!-- Arrow: App → AIClient -->
  <line x1="456" y1="112" x2="494" y2="112" stroke="#6A6A6E" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4 3"/>

  <!-- AIClient box (orange border + glow) -->
  <rect x="497" y="70" width="118" height="80" rx="8" fill="url(#clientFill)" stroke="#F05138" stroke-width="2" filter="url(#softGlow)"/>
  <text x="556" y="97"  fill="#F05138" font-size="12.5" font-weight="700" text-anchor="middle">AIClient</text>
  <text x="556" y="113" fill="#C8C8D0" font-size="9.5"  text-anchor="middle" opacity="0.70">actor</text>
  <text x="556" y="129" fill="#C8C8D0" font-size="9"    text-anchor="middle" opacity="0.55">tools · skills · recipes</text>

  <!-- Arrows: AIClient → each provider -->
  <path d="M 615 93 Q 635 93 645 72"  stroke="#6A6A6E" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line  x1="615" y1="112" x2="645" y2="112"          stroke="#6A6A6E" stroke-width="1.5"             stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M 615 131 Q 635 131 645 152" stroke="#6A6A6E" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- Provider: Claude (active — amber) -->
  <rect x="648" y="54"  width="140" height="32" rx="6" fill="url(#claudeFill)" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="664" cy="70" r="5" fill="#F59E0B" opacity="0.95"/>
  <text x="726" y="74" fill="#F0D090" font-size="11" font-weight="600" text-anchor="middle">Claude</text>

  <!-- Provider: OpenAI (active — green) -->
  <rect x="648" y="96"  width="140" height="32" rx="6" fill="url(#openAIFill)" stroke="#16A34A" stroke-width="1.5"/>
  <circle cx="664" cy="112" r="5" fill="#4ADE80" opacity="0.95"/>
  <text x="726" y="116" fill="#86EFAC" font-size="11" font-weight="600" text-anchor="middle">OpenAI</text>

  <!-- Provider: Apple Intelligence (active — blue) -->
  <rect x="648" y="138" width="140" height="32" rx="6" fill="url(#appleFill)" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="664" cy="154" r="5" fill="#60A5FA" opacity="0.95"/>
  <text x="726" y="158" fill="#93C5FD" font-size="11" font-weight="600" text-anchor="middle">Apple Intelligence</text>

  <!-- Caption under diagram -->
  <text x="556" y="200" fill="#606068" font-size="9.5" text-anchor="middle">swap providers without changing app code</text>
</svg>
